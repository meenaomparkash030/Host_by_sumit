version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=your-secret-key-here
      - PLATFORM=docker
      - FLASK_DEBUG=False
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./servers:/app/servers
      - ./backups:/app/backups
    restart: unless-stopped